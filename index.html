<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Utileria.js</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container">
        <h1>Registro de Usuario</h1>

        <form id="formularioRegistro">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre">
                <small id="errorNombre" class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="text" id="correo" name="correo">
                <small id="errorCorreo" class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password">
                <small id="errorPassword" class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                <small id="errorFecha" class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="numeroTelefono">Número Telefónico (máx. 10):</label>
                <input type="text" id="numeroTelefono" name="numeroTelefono">
                <small id="errorTelefono" class="error-message"></small>
            </div>

            <button type="submit" id="btnRegistrar">Registrar</button>
        </form>
<div class="redirect-container">
    <p>¿Ya tienes una cuenta?</p>
    <a href="login.html" class="btn-secondary">Iniciar sesión</a>
</div>

    </div>

    <div id="modalEdad" class="modal-overlay">
        <div class="modal-content">
            <h2>Resultado de Validación</h2>
            <p id="mensajeModal"></p>
            <p id="identificadorModal"></p>
            <button id="btnCerrarModal">Cerrar</button>
        </div>
    </div>

    <script src="js/utileria.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
